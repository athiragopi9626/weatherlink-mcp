
name: Build and Push Weather AgentCore Images

on:
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - "mcp/**"
      - "src/**"
      - "weather.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".github/workflows/docker-build-push.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: weather-docker-build-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_MCP_REPOSITORY: weather-mcp-primary
  ECR_AGENT_REPOSITORY: weather-mcp-primary-agent

jobs:
  build-and-push:
    name: Build ARM64 Images and Push to ECR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: weather-docker-build

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Enable ARM64 builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 5. Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Generate a unique image tag
      # Both images use the same 12-character commit SHA.
      - name: Generate image tag
        id: image
        shell: bash
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::12}"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $IMAGE_TAG"

      # 7. Build and push MCP server image
      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./mcp/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_MCP_REPOSITORY }}:${{ steps.image.outputs.tag }}

      # 8. Build and push LangGraph agent image
      - name: Build and push LangGraph image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./agent/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_AGENT_REPOSITORY }}:${{ steps.image.outputs.tag }}

      # 9. Verify both images exist in ECR
      - name: Verify pushed images
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_MCP_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION"

          aws ecr describe-images \
            --repository-name "$ECR_AGENT_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION"

      # 10. Display image information
      - name: Show pushed images
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "Successfully pushed both images"
          echo "Image tag: $IMAGE_TAG"
          echo "MCP: $ECR_REGISTRY/$ECR_MCP_REPOSITORY:$IMAGE_TAG"
          echo "Agent: $ECR_REGISTRY/$ECR_AGENT_REPOSITORY:$IMAGE_TAG"

      # 11. Publish image tag as a workflow artifact
      # A separate Terraform workflow can retrieve this tag.
      - name: Save image tag
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "$IMAGE_TAG" > image-tag.txt

      - name: Upload image tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-image-tag
          path: image-tag.txt
          retention-days: 30
