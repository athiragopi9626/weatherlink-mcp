[project]
name = "weatherlink-mcp"
version = "0.1.0"
description = "weatherlink-mcp"
readme = "README.md"
authors = [
    { name = "athiragopi9626", email = "athiragopi9626@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain[mcp]>=1.5.0",
    "langgraph>=1.2.21",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
    "boto3",
    "httpx",
    "bedrock-agentcore>=1.26.0",
    "streamlit>=1.67.0",
]

[project.scripts]
weatherlink-mcp = "weatherlink_mcp:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
